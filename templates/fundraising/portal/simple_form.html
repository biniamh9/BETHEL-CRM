{% extends "base_portal.html" %}{% load church %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1></div>
<form method="post" class="form-panel">{% csrf_token %}
  <div class="panel"><div class="panel-body">{% form_fields form %}</div></div>
  <div class="form-actions"><button class="btn btn-primary">Save</button><a class="btn btn-ghost" href="{{ back }}">Cancel</a></div>
</form>
{% endblock %}
