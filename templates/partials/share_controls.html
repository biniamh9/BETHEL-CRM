<section class="share-panel" data-share-panel aria-labelledby="share-this-page-title">
  <div class="wrap share-panel-inner">
    <div><span class="eyebrow">Share the story</span><h2 id="share-this-page-title">Invite someone into this moment.</h2><p>Share this page with family and friends, or copy the link for later.</p></div>
    <div class="share-actions">
      <button class="share-action share-primary" type="button" data-share-native>Share</button>
      <a class="share-action" href="#" data-share-facebook target="_blank" rel="noopener">Facebook</a>
      <button class="share-action" type="button" data-share-platform="Instagram">Instagram</button>
      <button class="share-action" type="button" data-share-platform="TikTok">TikTok</button>
      <button class="share-action" type="button" data-share-copy>Copy link</button>
      <span class="share-status" data-share-status role="status" aria-live="polite"></span>
    </div>
  </div>
</section>
