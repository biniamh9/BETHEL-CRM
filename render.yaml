services:
  - type: web
    name: bethel-crm
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: bethel-crm.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://bethel-crm.onrender.com
      - key: DATABASE_URL
        sync: false   # paste your Supabase connection string in the Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CHURCH_EIN
        sync: false
      - key: CHURCH_ZELLE
        sync: false
